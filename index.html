<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E4">
<title>Storia della musica illustrata</title>
<meta name="description" content="Storia della musica illustrata per la scuola primaria – Antonio Guida">
<link rel="icon" href="img/ottavio/ritratto.png">
<link rel="stylesheet" href="css/app.css">
<noscript><style>.boot-js{display:none}</style></noscript>
<script>
  /* se qualcosa va storto all'avvio, lo scrivo sullo schermo invece di lasciare la pagina vuota */
  window.addEventListener("error", function (e) {
    var s = document.getElementById("stage");
    if (s && !s.querySelector(".pg")) s.innerHTML = '<div class="boot"><p><b>Il libro non si è aperto.</b></p><p class="boot-hint">Messaggio per l\'assistenza: ' + String(e.message || "errore sconosciuto").replace(/</g, "&lt;") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "") + "</p></div>";
  });
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="tb-btn" id="btn-home" aria-label="Vai all'indice" title="Indice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="tb-lbl">Indice</span>
    </button>
    <div id="where" aria-live="polite"></div>
    <div class="tb-group" id="tts-group">
      <button class="tb-btn tts-main" id="btn-read" aria-label="Leggi la pagina ad alta voce" title="Leggi la pagina">
        <svg class="ic-speak" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        <span class="tb-lbl" id="read-lbl">Leggi</span>
      </button>
      <button class="tb-btn" id="btn-stop" aria-label="Ferma la lettura" title="Ferma la lettura">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <button class="tb-btn" id="btn-settings" aria-label="Impostazioni" title="Impostazioni">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="tb-btn" id="btn-full" aria-label="Schermo intero" title="Schermo intero">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <main id="stage" aria-live="off"><noscript><div class="boot"><img src="img/ottavio/legge.png" alt=""><p><b>Qui il libro non può aprirsi.</b></p><p class="boot-hint">Questa finestra mostra il file ma non fa funzionare l'app (per esempio l'anteprima di una chat o di un'e-mail). Salva il file sul computer e aprilo con un doppio clic: si aprirà con Chrome, Edge o Firefox.</p></div></noscript><div class="boot boot-js"><img src="img/ottavio/legge.png" alt=""><p><b>Sto aprendo il libro…</b></p><p class="boot-hint">Se questa scritta non scompare entro qualche secondo, chiudi questa finestra e apri il file con un doppio clic, usando Chrome, Edge o Firefox.</p></div></main>

  <footer id="bottombar">
    <button class="nav-btn" id="btn-prev" aria-label="Pagina precedente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Indietro</span>
    </button>
    <div id="progress" aria-hidden="true"><div id="progress-fill"></div><div id="progress-marks"></div></div>
    <div id="pagecount"></div>
    <button class="nav-btn primary" id="btn-next" aria-label="Pagina successiva">
      <span>Avanti</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>
</div>

<div id="settings" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="set-title">
  <div class="modal-card">
    <div class="modal-head">
      <img src="img/ottavio/legge.png" alt="">
      <h2 id="set-title">Impostazioni</h2>
      <button class="close-btn" data-close aria-label="Chiudi">×</button>
    </div>
    <div class="set-row">
      <label for="set-voice">Voce che legge</label>
      <select id="set-voice"></select>
      <p class="set-note" id="voice-note"></p>
    </div>
    <div class="set-row">
      <label for="set-rate">Velocità della voce: <b id="rate-val"></b></label>
      <input type="range" id="set-rate" min="0.6" max="1.4" step="0.05">
      <button class="small-btn" id="btn-test-voice">Prova la voce</button>
    </div>
    <div class="set-row">
      <span class="set-lbl">Grandezza del testo</span>
      <div class="seg" id="set-size">
        <button data-size="0.85">A−</button><button data-size="1">A</button><button data-size="1.15">A+</button><button data-size="1.3">A++</button>
      </div>
    </div>
    <div class="set-row checks">
      <label><input type="checkbox" id="set-auto"> Leggi la pagina appena la apro</label>
      <label><input type="checkbox" id="set-sfx"> Suoni nei giochi</label>
      <label><input type="checkbox" id="set-files"> Mostra i nomi dei file audio (per l'insegnante)</label>
    </div>
    <div class="set-row">
      <button class="small-btn" id="btn-info">Informazioni e controllo degli ascolti</button>
    </div>
  </div>
</div>

<div id="lightbox" hidden>
  <img alt="">
  <button class="close-btn" data-close aria-label="Chiudi l'immagine">×</button>
</div>

<script src="js/data.js"></script>
<script src="js/crediti.js"></script>
<script src="js/hyph-it.js"></script>
<script src="js/app.js"></script>
<script>
  (function () {
    var s = document.getElementById("stage");
    if (!s || s.querySelector(".pg")) return;
    var miss = [];
    if (!window.BOOK) miss.push("data.js");
    if (!window.CREDITI) miss.push("crediti.js");
    if (typeof window.hyphenateIt !== "function") miss.push("hyph-it.js");
    if (miss.length) s.innerHTML = '<div class="boot"><p><b>Il libro non si è aperto.</b></p><p class="boot-hint">Non riesco a leggere questi file della cartella js: ' + miss.join(", ") + '. Controlla che la cartella dell\'app sia completa.</p></div>';
  })();
</script>
</body>
</html>
